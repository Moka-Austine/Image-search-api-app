name: Preserve Manual README and Inject Auto Content

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v3

      # Optional: Generate AI content using a basic action (no API key needed)
      - name: ✨ Generate README section (static placeholder)
        run: |
          cat <<EOF > auto_readme_section.md
          ## Features

          - Automated CI/CD
          - Mermaid.js visualizations
          - Auto-updating documentation
          EOF

      - name: 📊 Create Mermaid CI/CD Diagram
        run: |
          cat <<EOF > cicd_diagram.md
          \`\`\`mermaid
          graph TD;
              A[Commit] --> B[Build]
              B --> C[Test]
              C --> D[Deploy]
          \`\`\`
          EOF

      - name: 🧠 Inject content into README.md
        run: |
          # Replace auto-readme section
          awk '
            BEGIN {in=0}
            /<!-- auto-readme -->/ {print; while ((getline line < "auto_readme_section.md") > 0) print line; in=1; next}
            /<!-- end-auto-readme -->/ {in=0}
            !in
          ' README.md > tmp && mv tmp README.md

          # Replace CI/CD diagram section
          awk '
            BEGIN {in=0}
            /<!-- ci-cd-diagram -->/ {print; while ((getline line < "cicd_diagram.md") > 0) print line; in=1; next}
            /<!-- end-ci-cd-diagram -->/ {in=0}
            !in
          ' README.md > tmp && mv tmp README.md

      - name: 🚀 Commit and Push if Changed
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "🔄 Update dynamic README sections"
          git push
