name: Generate and Update README with CI/CD Diagram

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      # Step 1: Generate base README using an actual action
      - name: 📄 Generate README
        uses: patched-codes/GenerateREADME@0.1.0

      # Step 2 (OPTION A): Insert Mermaid diagram into a placeholder
      - name: 🔧 Insert Mermaid CI/CD diagram into README
        run: |
          DIAGRAM='```mermaid
          graph TD;
              A[Commit] --> B[Build];
              B --> C[Test];
              C --> D[Deploy];
          ```'

          awk -v diagram="$DIAGRAM" '
          BEGIN {in_block=0}
          {
            if ($0 ~ /<!-- ci-cd-diagram -->/) {
              print $0;
              print diagram;
              in_block=1;
              next;
            }
            if (in_block && $0 ~ /```/) {
              in_block=0;
              next;
            }
            if (!in_block) print $0;
          }' README.md > temp.md && mv temp.md README.md

      # Step 3 (OPTION B - OPTIONAL): Render to SVG and embed
      - name: 🖼️ Install mermaid CLI and render SVG
        run: |
          npm install -g @mermaid-js/mermaid-cli
          echo 'graph TD;
            A[Commit] --> B[Build];
            B --> C[Test];
            C --> D[Deploy];' > diagram.mmd
          mmdc -i diagram.mmd -o diagram.svg

      - name: 📎 Embed rendered image into README
        run: |
          if ! grep -q "![CI/CD Diagram](diagram.svg)" README.md; then
            echo -e "\n![CI/CD Diagram](diagram.svg)" >> README.md
          fi

      # Step 4: Commit changes (if any)
      - name: 🚀 Commit and push
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add README.md diagram.svg || true
          git diff --cached --quiet || git commit -m "Auto-update README with CI/CD diagram"
          git push
