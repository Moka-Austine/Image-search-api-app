name: Update CI/CD Pipeline Diagram

on:
  push:
    paths:
      - '.github/workflows/*'

jobs:
  update-diagram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Update README with new diagram
        run: |
          # Generate the Mermaid.js diagram
          echo '```mermaid
          graph TD;
              A[Commit] --> B[Build];
              B --> C[Test];
              C --> D[Deploy];
          ```' > README.md

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add README.md
          git commit -m 'Update CI/CD pipeline diagram'
          git push
